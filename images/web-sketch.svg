<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Web development building blocks</title>
  <desc id="desc">A simple original SVG sketch showing HTML, CSS, and JavaScript blocks pointing toward a finished web page.</desc>
  <rect width="800" height="420" fill="#f7f9ff"/>
  <rect x="70" y="80" width="160" height="100" rx="16" fill="#ffffff" stroke="#1f3c88" stroke-width="4"/>
  <rect x="320" y="80" width="160" height="100" rx="16" fill="#ffffff" stroke="#1f3c88" stroke-width="4"/>
  <rect x="570" y="80" width="160" height="100" rx="16" fill="#ffffff" stroke="#1f3c88" stroke-width="4"/>
  <text x="150" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1f3c88">HTML</text>
  <text x="400" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1f3c88">CSS</text>
  <text x="650" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1f3c88">JS</text>
  <text x="150" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333333">Structure</text>
  <text x="400" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333333">Style</text>
  <text x="650" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333333">Interaction</text>
  <line x1="150" y1="200" x2="325" y2="275" stroke="#1f3c88" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="400" y1="200" x2="400" y2="270" stroke="#1f3c88" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="650" y1="200" x2="475" y2="275" stroke="#1f3c88" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="260" y="280" width="280" height="80" rx="16" fill="#1f3c88"/>
  <text x="400" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Web Page</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#1f3c88"/>
    </marker>
  </defs>
</svg>
